name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Third-party actions are pinned to full commit SHAs; the trailing comment is the release it came from.
# To bump one: `git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>^{}'` (or the tag itself if lightweight).

jobs:
  dotnet:
    name: Build (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mailsink.slnx

      - name: Build
        run: dotnet build Mailsink.slnx -c Release --no-restore

  web:
    name: Build web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Mailsink.Web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Mailsink.Web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload wwwroot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wwwroot
          path: src/Mailsink.Server/wwwroot
          if-no-files-found: error

  # Every run builds linux/amd64 and linux/arm64 together. Only v* tags push to GHCR, publishing:
  #   1.2.3, 1.2, 1        from the git tag v1.2.3 (1.2 and 1 are skipped for prereleases like v1.3.0-rc.1)
  #   sha-<7 chars>        the short commit SHA (immutable)
  #   latest               the newest non-prerelease tag
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mailsink
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Dockerfile cross-compiles on the runner's platform; QEMU only backs the (RUN-free) arm64 runtime stage.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # `docker buildx build --cache-to type=gha` needs the Actions cache URL and token, which are only
      # visible to JavaScript actions; this exports them to later `run` steps.
      - name: Expose GitHub Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch pushes: same multi-platform build, kept in the build cache only, to prove both platforms still build.
      - name: Build (linux/amd64 + linux/arm64)
        if: env.PUBLISH != 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/Dockerfile \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=cacheonly \
            .

      - name: Build and push (linux/amd64 + linux/arm64)
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r label; do
            if [ -n "$label" ]; then args+=(--label "$label"); fi
          done <<< "$LABELS"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/Dockerfile \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            "${args[@]}" \
            --push \
            .

      # Fails the release unless the pushed sha-<short> tag is an index containing both platforms.
      - name: Verify published platforms
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ref=$(grep -m1 ':sha-' <<< "$TAGS" || true)
          if [ -z "$ref" ]; then
            echo "::error::No sha-<short> tag in the image metadata"
            exit 1
          fi

          docker buildx imagetools inspect "$ref"

          platforms=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]?.platform | select(. != null) | "\(.os)/\(.architecture)"' \
            | sort -u)

          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "$want" <<< "$platforms"; then
              echo "::error::$ref is missing $want (found: $(tr '\n' ' ' <<< "$platforms"))"
              exit 1
            fi
          done
          echo "$ref has linux/amd64 and linux/arm64"
